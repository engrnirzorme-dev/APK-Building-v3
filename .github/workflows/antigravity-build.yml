name: Anti-Gravity 2 GitHub Action 2 APK Builder

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type (release or debug)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      app_name:
        description: 'App Name / Blueprint Identifier'
        required: false
        default: 'ClipBoardVault'

jobs:
  build-apk:
    name: Build Android APK on Cloud
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java 21 (Zulu Distribution)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 3. Setup Android SDK Environment
        uses: android-actions/setup-android@v3

      - name: 4. Inject & Initialize Anti-Gravity CLI
        env:
          ANTI_GRAVITY_TOKEN: ${{ secrets.ANTI_GRAVITY_TOKEN }}
        run: |
          echo "🚀 Initializing Anti-Gravity CLI Environment..."
          mkdir -p ~/.antigravity/bin
          
          if [ -f "./scripts/setup_env.sh" ]; then
            chmod +x ./scripts/setup_env.sh
            ./scripts/setup_env.sh
          else
            echo "⚡ Pre-flight environment check..."
            java -version
          fi

      - name: 5. Execute Anti-Gravity APK Build
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          APP_NAME: ${{ inputs.app_name }}
          ANTI_GRAVITY_TOKEN: ${{ secrets.ANTI_GRAVITY_TOKEN }}
        run: |
          echo "🔨 Starting APK Build for Variant: ${BUILD_TYPE}..."
          mkdir -p build/outputs/apk/${BUILD_TYPE}
          
          if [ -f "./scripts/build_apk.sh" ]; then
            chmod +x ./scripts/build_apk.sh
            ./scripts/build_apk.sh ${BUILD_TYPE} "${APP_NAME}"
          fi

      - name: 6. Copy APK to releases folder
        run: |
          mkdir -p releases
          cp -v build/outputs/apk/**/*.apk releases/ 2>/dev/null || echo "No APK files found in build/outputs"
          ls -la releases/

      - name: 7. Commit and Push APK to Repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add releases/
          git commit -m "build: APK generated - ${{ inputs.app_name }}-${{ inputs.build_type }} on $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push origin main || echo "Push skipped - may have protection rules"

      - name: 8. Upload Build Artifacts (APK)
        uses: actions/upload-artifact@v4
        with:
          name: AntiGravity-APK-${{ inputs.app_name }}-${{ inputs.build_type }}
          path: |
            build/outputs/apk/**/*.apk
            releases/**/*.apk
          retention-days: 90
          if-no-files-found: warn

      - name: 9. Build Completion Report
        if: always()
        run: |
          echo "=========================================="
          echo "✅ Build Process Completed!"
          echo "=========================================="
          echo "📱 App Name: ${{ inputs.app_name }}"
          echo "🔧 Build Type: ${{ inputs.build_type }}"
          echo "📁 APK Location: /releases folder in repository"
          echo "📦 GitHub Artifacts: 90 Days retention"
          echo "⏰ Build Time: $(date)"
          echo "=========================================="
